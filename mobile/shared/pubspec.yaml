name: alas_shared
description: Shared models, API client, theme and translations for the Alas apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.7
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-400.ttf
        - asset: assets/fonts/NotoKufiArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
